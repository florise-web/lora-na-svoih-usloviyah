  lead:'С вами все в порядке. Одного понимания здесь не хватает никому, нужны план и опора.',
  out:'Все эти ответы про одно: надежда и страх весят для вас больше, чем то, что происходит на самом деле.',
  say:'Я сама много раз пыталась уйти из отношений, в которых мне было плохо. Получилось, когда я перестала ждать, что он изменится, и начала опираться на себя.',
  loop:['Снова ссора или холод','«Он изменится, бывает же хорошо»','Остаюсь и стараюсь сильнее','Через месяц все повторяется'],
  nw:'Записываю факты: что он сделал, а не что пообещал.',
  tools:[['Психоанализ','Разбираем, что именно держит: привязанность, страх, вложенные годы.'],['План опоры','По шагам: эмоционально, по деньгам, по быту.'],['Личная работа','Выход из тяжелых отношений лучше вести лично, со мной или другим специалистом.']],
  st:{sub:'Отделить факты от надежды',a:'Вы снова думаете «бывает же хорошо».',q:'«Что он сделал за последний месяц, а не пообещал?»',qs:'Запишите три факта. Не чувства, а поступки.',h3:'Сохраните список',c:'Перечитайте его, когда снова захочется поверить, что все изменится само.',why:'Решения из надежды откладываются годами. Решения из фактов можно принимать по одному маленькому шагу.'},
  good:'Видите, что вам плохо, и не обманываете себя',
  safety:true}
];
/* Блок «Что дальше?»: что человек найдет в канале. */
var CARDS = [
 {ask:'Как выйти из своего сценария?',ico:'1',t:'Подкасты Лоры',i:'В закрытом канале',c:'Про то, почему мы выбираем не тех и как поступать по-другому.'},
 {ask:'А можно разобрать мою ситуацию?',ico:'2',t:'Разбор вашего типа',i:'Голосом, на этой неделе',c:'Лора разбирает ситуации участниц канала. Вопрос можно прислать анонимно.'},
 {ask:'Можно пройти это вместе с Лорой?',ico:'3',t:'Программа «На своих условиях»',i:'Старт 1 декабря',c:'4 недели с Лорой. Участницы канала первыми узнают условия.'}
];
var DISCLAIM = 'Это авторский рефлексивный тест без научной стандартизации. Он не является психологической, психотерапевтической или медицинской диагностикой и не заменяет консультацию психолога, психотерапевта или врача. Если вам сейчас тяжело или рядом с партнером небезопасно, обратитесь, пожалуйста, к специалисту очно.';
var WORDS = ['слабо','умеренно','заметно','сильно'];

var tg = window.Telegram && Telegram.WebApp ? Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
var app = document.getElementById('app'), step = -1, ans = [], fork = null;
var N = Q.length;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function av(){return '<div class="av">'+(AV?'<img src="'+esc(AV)+'" alt="">':'Л')+'</div>';}
function who(){return '<div class="who">'+av()+'<b>'+esc(NAME)+', психолог и сексолог</b></div>';}
function say(t){return '<div class="say">'+av()+'<div class="bub"><b>'+esc(NAME)+'</b>'+esc(t)+'</div></div>';}
function doc(k,t){return DOCS[k]?'<a href="'+esc(DOCS[k])+'" target="_blank" rel="noopener">'+t+'</a>':t;}
function hasDocs(){return DOCS.policy||DOCS.consent||DOCS.mailing;}
function level(v){return v<=3?0:v<=6?1:v<=9?2:3;}
function lower(t){t=t.replace(/\.$/,'');return t.charAt(0).toLowerCase()+t.slice(1);}

function intro(){
  app.innerHTML=who()+
   '<div class="hero"><span class="badge">Тест · 2 минуты</span>'+
   '<h1>Что мешает вам жить в отношениях на своих условиях?</h1>'+
   '<p>Качели, растворение, молчание или надежда. Узнаете, какой сценарий у вас повторяется, и с какого шага его остановить.</p></div>'+
   '<ul class="checks"><li><i class="ck"></i><span>Какой сценарий сейчас решает за вас?</span></li>'+
   '<li><i class="ck"></i><span>Где повторяется ваш привычный круг?</span></li>'+
   '<li><i class="ck"></i><span>Как я с этим работаю?</span></li>'+
   '<li><i class="ck"></i><span>Что можно сделать уже сегодня вечером?</span></li></ul>'+
   say('Почти каждая девушка, которая ко мне приходит, уже все про себя понимает. И все равно снова оказывается там же. Этот тест покажет, где именно у вас включается старый сценарий.')+
   '<div class="chips"><span>психоанализ</span><span>сексология</span><span>отношения</span><span>самоценность</span></div>'+
   '<p>Здесь шестнадцать утверждений. Отвечайте по тому, как бывает обычно, а не по тому, как хотелось бы.</p>'+
   '<p>Хороших и плохих результатов нет. Результат помогает выбрать первый шаг, а не оценить вас.</p>'+
   '<button class="btn" id="go" type="button">Начать</button>'+
   (hasDocs()?'<div class="legal">Нажимая «Начать», вы соглашаетесь с '+doc('policy','Политикой обработки персональных данных')+' и даете '+doc('consent','согласие на их обработку')+'.</div>':'')+
   '<div class="foot"><p>'+DISCLAIM+'</p></div>';
  document.getElementById('go').onclick=function(){step=0;render();};
}
function question(){
  var q=Q[step],h='<div class="bar"><i style="width:'+(step/(N+1)*100)+'%"></i></div>'+
   '<div class="count">'+(step+1)+' из '+N+'</div>'+
   (q.note?'<div class="note">'+esc(q.note)+'</div>':'')+
   '<div class="stmt">'+esc(q.t)+'</div>';
  SCALE.forEach(function(s){h+='<button type="button" class="opt'+(ans[step]===s[1]?' on':'')+'" data-v="'+s[1]+'">'+s[0]+'</button>';});
  h+='<div class="re" id="re"></div>';
  h+='<button type="button" class="back" id="back">Назад</button>';
  app.innerHTML=h;
  var locked=false;
  [].forEach.call(app.querySelectorAll('.opt'),function(b){b.onclick=function(){
    if(locked)return;locked=true;
    var v=+b.getAttribute('data-v');ans[step]=v;
    [].forEach.call(app.querySelectorAll('.opt'),function(x){x.className='opt';});b.className='opt on';
    var show=q.re&&v>=2;
    if(show)document.getElementById('re').textContent=q.re;
    setTimeout(function(){step++;render();},show?1500:170);};});
  document.getElementById('back').onclick=function(){step--;render();};
}
function forkScreen(){
  var h='<div class="bar"><i style="width:'+(N/(N+1)*100)+'%"></i></div><div class="count">Последний вопрос</div>'+
   '<div class="stmt" style="min-height:0;margin-bottom:8px">'+esc(FORK.q)+'</div>';
  FORK.a.forEach(function(a,i){h+='<button type="button" class="opt'+(fork===i?' on':'')+'" data-i="'+i+'">'+a[0]+'</button>';});
  h+='<button type="button" class="back" id="back">Назад</button>';
  app.innerHTML=h;
  [].forEach.call(app.querySelectorAll('.opt'),function(b){b.onclick=function(){
    fork=+b.getAttribute('data-i');b.className='opt on';setTimeout(function(){step++;render();},170);};});
  document.getElementById('back').onclick=function(){step--;render();};
}
function sums(){var s=[0,0,0,0];Q.forEach(function(q,i){s[q.s]+=ans[i]||0;});return s;}
function winner(s){
  var max=Math.max.apply(null,s),ties=[];
  for(var k=0;k<4;k++)if(s[k]===max)ties.push(k);
  if(ties.length>1&&ties.indexOf(3)>=0)return 3; /* при равенстве с «надеждой» показываем ее: там важнее безопасность */
  var best=ties[0],bt=-1;
  ties.forEach(function(k){var t=0;Q.forEach(function(q,i){if(q.s===k&&ans[i]===3)t++;});if(t>bt){bt=t;best=k;}});
  return best;
}
function result(){
  var s=sums(),w=winner(s),r=R[w];
  var fk=FORK.a[fork][1];
  var link=(USE_BOT_LINK&&BOT)?('https://t.me/'+BOT+'?start=res_'+r.k+'_'+fk):CHANNEL;
  var h=who()+'<div class="hero"><span class="badge">Ваш сценарий: '+r.row.toLowerCase()+'</span><h1 class="res">'+esc(r.t)+'</h1></div>';
  r.p.forEach(function(x){h+='<p>'+esc(x)+'</p>';});
  h+='<div class="lead">'+esc(r.lead)+'</div>';
  if(r.safety)h+='<div class="safety">Если рядом с ним вам страшно, есть угрозы, контроль или насилие, начните с безопасности. Обратитесь к специалисту очно или в кризисную службу вашего города.</div>';
  h+='<h3>Где это видно сильнее всего?</h3><div class="sit"><b>'+SIT[fk][0]+'</b><span>'+SIT[fk][1]+'</span></div>';
  h+='<h3>Что видно по вашим ответам?</h3>';
  R.forEach(function(x,k){var l=level(s[k]),d='';for(var i=0;i<4;i++)d+='<i'+(i<=l?' class="f"':'')+'></i>';
    h+='<div class="sc'+(k===w?' me':'')+'"><div class="n">'+x.row+'</div><div class="l"><div class="seg">'+d+'</div><div class="w">'+WORDS[l]+'</div></div></div>';});
  h+=say(r.say);
  var good=[];[0,1,2,3].sort(function(a,b){return s[a]-s[b];}).forEach(function(k){if(k!==w&&level(s[k])===0&&good.length<2)good.push(R[k].good);});
  if(good.length){h+='<h3>Что у вас уже работает?</h3>';good.forEach(function(g){h+='<div class="pw"><i class="ck"></i><span>'+g+'</span></div>';});}
  var said=[];
  [3,2].forEach(function(v){Q.forEach(function(q,i){if(q.s===w&&ans[i]===v)said.push(q.t);});});
  if(said.length>=2){
    h+='<h3>Почему все повторяется?</h3><div class="said"><div class="hd">Вы сами отметили в тесте:</div>';
    said.slice(0,3).forEach(function(t){h+='<div class="it"><i class="ck soft"></i><span>'+esc(lower(t))+'</span></div>';});
    h+='</div><p>'+esc(r.out)+'</p>';
  }
  var lb=['Что происходит','Привычная мысль','Привычный ответ','Чем заканчивается'];
  h+='<h3>Ваш привычный круг</h3><div class="loop">';
  r.loop.forEach(function(x,i){h+='<div class="lp"><span>'+lb[i]+'</span><b>'+esc(x)+'</b></div>'+(i<3?'<div class="ar" aria-hidden="true">↓</div>':'');});
  h+='</div><div class="phr"><b>Новый ответ</b><span>'+esc(r.nw)+'</span></div>'+
     '<p style="font-size:15px;color:var(--muted)">Вы можете менять свое участие в ситуации. Решения другого человека остаются за ним, и по ним вы видите, что делать дальше.</p>';
  h+='<h3>Как я с этим работаю?</h3>';
  r.tools.forEach(function(t){h+='<div class="tool"><span class="tg">'+t[0]+'</span><div>'+esc(t[1])+'</div></div>';});
  var st=r.st;
  h+='<h3>Что можно сделать уже сегодня вечером?</h3><div class="sub">'+esc(st.sub)+'</div>'+
     '<div class="stp"><div class="no">1</div><div class="bd"><b>Поймайте момент</b><span>'+esc(st.a)+'</span></div></div>'+
     '<div class="stp"><div class="no">2</div><div class="bd"><b>Спросите себя</b></div></div>'+
     '<div class="phr"><b>'+esc(st.q)+'</b><span>'+esc(st.qs)+'</span></div>'+
     '<div class="stp"><div class="no">3</div><div class="bd"><b>'+esc(st.h3)+'</b><span>'+esc(st.c)+'</span></div></div>'+
     '<h4>Почему это работает?</h4>'+say(st.why);
  var cards='',tot='';
  CARDS.forEach(function(c){
    cards+='<div class="ask"><span>'+esc(c.ask)+'</span></div>'+
      '<div class="card"><div class="top"><div class="ico">'+esc(c.ico)+'</div><div class="ti"><b>'+esc(c.t)+'</b><i>'+esc(c.i)+'</i></div></div><div class="cap">'+esc(c.c)+'</div></div>';
    tot+='<div class="pw"><i class="ck"></i><span>'+esc(c.t)+'</span></div>';
  });
  var cta='Перейти в закрытый канал';
  h+='<h3>Что дальше?</h3><div class="lines"><p>Вы увидели свой сценарий и свой привычный круг.</p><p>Дальше обычно остается несколько вопросов.</p><p>На каждый у меня есть ответ.</p></div>'+
     cards+'<div class="all">Все это ждет вас в закрытом канале.</div>'+
     '<a class="btn" id="get" href="'+esc(link)+'">'+cta+' →</a>'+
     '<div class="small">Бесплатно. Откроется телеграм.</div>'+
     '<div class="total"><b>Что вы найдете в канале</b>'+tot+'</div>'+
     '<a class="btn" id="get2" href="'+esc(link)+'">'+cta+' →</a>'+
     (DOCS.mailing?'<div class="legal">Нажимая кнопку, вы переходите в телеграм и даете '+doc('mailing','согласие на получение сообщений')+'. Отписаться можно в любой момент.</div>':'')+
     '<p style="text-align:center;font-weight:600;margin-top:22px">А сегодня выберите один поступок, после которого сможете сказать: «В этот раз я выбрала себя».</p>'+
     '<button type="button" class="btn ghost" id="again">Пройти заново</button>'+
     '<div class="foot"><p>'+DISCLAIM+'</p>'+(hasDocs()?'<p>'+doc('policy','Политика обработки персональных данных')+' · '+doc('consent','Согласие на обработку персональных данных')+' · '+doc('mailing','Согласие на рассылку')+'</p>':'')+'<p>© '+esc(NAME)+' Константиниди</p></div>';
  app.innerHTML=h;
  ['get','get2'].forEach(function(id){document.getElementById(id).onclick=function(e){
    if(tg&&tg.openTelegramLink&&link.indexOf('https://t.me/')===0){e.preventDefault();try{tg.openTelegramLink(link);}catch(x){location.href=link;}}};});
  document.getElementById('again').onclick=function(){step=-1;ans=[];fork=null;render();};
}
function render(){
  if(step<0)intro();else if(step<N)question();else if(step===N)forkScreen();else result();
  window.scrollTo(0,0);
}
render();
</script>
</body>
</html>
